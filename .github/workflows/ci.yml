name: CI

on:
  push:
    branches: [main]
  pull_request:

# SPEC §C34 — tests gate deploy. The deploy job lands with T20 (Terraform)
# and will require this job.
jobs:
  verify:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install web deps
        run: npm ci --prefix web

      - name: Install api deps
        run: python -m pip install --upgrade pip && python -m pip install -e "api[dev]"

      - name: Verify
        run: npm run verify
